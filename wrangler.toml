# SkillzHQ delivery worker — `wrangler.toml`
#
# Deploy:
#   npx wrangler deploy
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put ENQUIRY_DESTINATION
#   npx wrangler secret put KIT_API_KEY
#
# The routes let the static site POST to the same-origin paths /api/enquiry
# and /api/frequency — the worker intercepts them before the origin host
# sees them. Requires the domain to be Cloudflare-proxied (orange-cloud) at
# djlethalskillz.com. Local test: npx wrangler dev (serves
# http://localhost:8787/api/enquiry and /api/frequency)

name = "skillzhq-enquiry"
main = "workers/enquiry.js"
compatibility_date = "2026-08-16"

routes = [
  { pattern = "djlethalskillz.com/api/enquiry", zone_name = "djlethalskillz.com" },
  { pattern = "djlethalskillz.com/api/frequency", zone_name = "djlethalskillz.com" }
]

# Non-secret config. Secrets are NOT stored here — see commands above.
[vars]
RESEND_FROM = "SkillzHQ <enquiries@djlethalskillz.com>"
KIT_FORM_ID = "9864310"
